# Starter config. Prefix stays Ctrl+b.

set -g mouse on                 # click a pane to focus it, drag borders to resize
set -g history-limit 50000      # Claude output is long
set -g base-index 1             # windows start at 1, matching the keys you press
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # stops Esc feeling laggy inside Claude
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # truecolor passthrough

# Splits that say which direction they go, opening in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane movement without the prefix. gnome-terminal does not claim Alt+arrows.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display "config reloaded"

# Default drag-end is copy-pipe-and-cancel; the cancel exits copy-mode and
# snaps to the bottom mid-scrollback. Copy but stay put instead.
# Both tables: mode-keys picks copy-mode (emacs) or copy-mode-vi, and binding
# only one leaves the other on the default copy-pipe-and-cancel, whose cancel
# drops you out of copy-mode on every drag release.
# copy-selection-no-clear only fills tmux's internal buffer; pipe to xclip so
# the selection actually reaches the system clipboard.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection clipboard"

# Default WheelUpPane hands the wheel to any app that enabled mouse reporting,
# so full-screen TUIs never reach scrollback. Always enter copy-mode instead.
bind -T root WheelUpPane if -F "#{pane_in_mode}" "send -M" "copy-mode -e"

# Without extended keys the terminal sends Ctrl+Shift+V as plain Ctrl+V, so
# tmux cannot see the Shift and the binding below would never fire.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Explicit copy to the system clipboard. no-clear keeps us in copy-mode.
# GNOME Terminal's own Ctrl+Shift+V paste shortcut must be disabled or it
# swallows the key: gsettings set <Keybindings path> paste "'disabled'"
bind -T copy-mode    C-S-v send -X copy-pipe-no-clear "xclip -in -selection clipboard"
bind -T copy-mode-vi C-S-v send -X copy-pipe-no-clear "xclip -in -selection clipboard"

# Status bar: window names on the left, so you can see every Claude at a glance.
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour24,fg=colour231,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=colour231,bold] #I:#W "
setw -g window-status-bell-style "bg=colour160,fg=colour231,bold"
set -g monitor-activity on      # marks a window that printed something
set -g visual-activity off
